packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@cloudflare/workers-types": 5.20261003.1
  "@hono/zod-openapi": 1.6.3
  "@neondatabase/serverless": 1.2.0
  "@sentry/cloudflare": 11.4.0
  "@sentry/hono": 11.4.0
  "@types/node": ^26.0.0
  aws4fetch: 1.0.20
  commander: 15.0.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.3
  fallow: 3.31.0
  hono: 4.13.12
  nanoid: 6.0.1
  playwright-core: 1.63.0
  typescript: 6.0.3
  wrangler: 4.147.0
  zod: 4.6.5
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.3
  vite-plus: 1.0.0
  "@vitest/coverage-v8": 5.0.3

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # @sentry/hono's peer range (^4.x) is stale; wrangler itself requires ^5.x and the mismatch
    # is TS-ambient-types-only, not a runtime incompatibility.
    "@cloudflare/workers-types": "*"
    # TS 7's native Go port drops ts.factory entirely, crashing openapi-typescript on import —
    # packages/sdk is held below 7 in renovate.json until openapi-ts/openapi-typescript#2841 lands.
    typescript: "<7"

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260808.1"
