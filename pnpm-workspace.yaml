packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@cloudflare/workers-types": 5.20260808.1
  "@hono/zod-openapi": 1.5.2
  "@neondatabase/serverless": 1.1.0
  "@sentry/cloudflare": 10.69.0
  "@sentry/hono": 10.69.0
  "@types/node": ^26.0.0
  aws4fetch: 1.0.20
  commander: 15.0.0
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  hono: 4.13.1
  nanoid: 6.0.1
  playwright-core: 1.62.1
  typescript: ^7.0.0
  wrangler: 4.120.0
  zod: 4.4.3

overrides:
  vite: "npm:@voidzero-dev/vite-plus-core@0.2.8"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # @sentry/hono's peer range (^4.x) is stale; wrangler itself requires ^5.x and the mismatch
    # is TS-ambient-types-only, not a runtime incompatibility.
    "@cloudflare/workers-types": "*"

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260808.1"
