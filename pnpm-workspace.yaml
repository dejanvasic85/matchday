packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@cloudflare/workers-types": 5.20260828.1
  "@hono/zod-openapi": 1.6.1
  "@neondatabase/serverless": 1.1.0
  "@sentry/cloudflare": 10.72.0
  "@sentry/hono": 10.72.0
  "@types/node": ^26.0.0
  aws4fetch: 1.0.20
  commander: 15.0.0
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  fallow: 3.20.0
  hono: 4.13.5
  nanoid: 6.0.1
  playwright-core: 1.62.1
  typescript: 6.0.3
  wrangler: 4.127.1
  zod: 4.5.1

overrides:
  vite: "npm:@voidzero-dev/vite-plus-core@0.3.0"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # @sentry/hono's peer range (^4.x) is stale; wrangler itself requires ^5.x and the mismatch
    # is TS-ambient-types-only, not a runtime incompatibility.
    "@cloudflare/workers-types": "*"
    # TS 7's native Go port drops ts.factory entirely, crashing openapi-typescript on import —
    # packages/sdk is held below 7 in renovate.json until openapi-ts/openapi-typescript#2841 lands.
    typescript: "<7"

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260808.1"
