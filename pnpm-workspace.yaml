packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@cloudflare/workers-types": 5.20260819.1
  "@hono/zod-openapi": 1.6.0
  "@neondatabase/serverless": 1.1.0
  "@sentry/cloudflare": 10.70.0
  "@sentry/hono": 10.70.0
  "@types/node": ^26.0.0
  aws4fetch: 1.0.20
  commander: 15.0.0
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  fallow: 3.17.0
  hono: 4.13.3
  nanoid: 6.0.1
  playwright-core: 1.62.1
  typescript: ^7.0.0
  wrangler: 4.124.0
  zod: 4.4.3

overrides:
  vite: "npm:@voidzero-dev/vite-plus-core@0.2.9"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # @sentry/hono's peer range (^4.x) is stale; wrangler itself requires ^5.x and the mismatch
    # is TS-ambient-types-only, not a runtime incompatibility.
    "@cloudflare/workers-types": "*"
    # openapi-typescript's peer range (^5.x) is stale for TS 6, which still exposes the JS
    # compiler API it builds ASTs with. It is NOT stale for TS 7: the native Go port drops
    # ts.factory entirely and openapi-typescript crashes on import, so packages/sdk is held
    # below 7 in renovate.json until openapi-ts/openapi-typescript#2841 lands. Capped at <7
    # rather than "*" so a TS 7 creeping back into the SDK still warns instead of going quiet.
    typescript: "<7"

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260808.1"
