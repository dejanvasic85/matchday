name: Crawl deep

on:
  schedule:
    # Weekday evenings, hourly, 6pm-11pm AEST (game evenings). UTC = AEST-10, no DST adjustment.
    - cron: "0 8-13 * * 1-5"
    # Weekends, hourly, 11am-11pm AEST (game days). UTC = AEST-10, no DST adjustment.
    - cron: "0 1-13 * * 6,0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  R2_PUBLIC_ASSETS_URL: ${{ secrets.R2_PUBLIC_ASSETS_URL }}
  R2_RAW_BUCKET_NAME: ${{ secrets.R2_RAW_BUCKET_NAME }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    outputs:
      leagues: ${{ steps.leagues.outputs.leagues }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: List subscribed leagues
        id: leagues
        run: |
          output=$(vp run --filter @matchday/cli mday subscribed-leagues)
          leagues=$(echo "$output" | grep -o '{.*}' | jq -c '.leagueIds')
          echo "leagues=$leagues" >> "$GITHUB_OUTPUT"
          echo "Subscribed leagues: $leagues"

  deep-crawl:
    name: Deep crawl
    needs: setup
    if: needs.setup.outputs.leagues != '[]'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        league: ${{ fromJson(needs.setup.outputs.leagues) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chrome-${{ hashFiles('pnpm-lock.yaml') }}

      # playwright:install deliberately omits --with-deps — see crawl-catalog.yml's Install Chrome
      # step for why (a flaky apt mirror can hang the OS-deps install ubuntu-latest doesn't need).
      - name: Install Chrome
        run: vp run --filter @matchday/cli playwright:install

      - name: Run deep crawl
        run: vp run --filter @matchday/cli mday deep-crawl --league ${{ matrix.league }}
