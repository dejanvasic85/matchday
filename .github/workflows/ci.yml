name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `changeset status --since=origin/main` below can actually diff against
          # main — the default shallow clone doesn't have it.
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Fails loudly if a PR changes packages/sdk without `pnpm changeset` — otherwise the
      # publish workflow just silently skips publishing a version nobody bumped (see
      # release-sdk.yml). Only meaningful on a PR; on push to main there's nothing to diff.
      # Exempts changesets/action's own "Version Packages" PR — it exists specifically to consume
      # (delete) the changesets that justify its version bump, so by design it never has one left.
      - name: Check for a changeset on SDK changes
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: vp run changeset status --since=origin/main

      # packages/sdk's types are generated from the live OpenAPI spec, not committed — `vp check`
      # type-checks straight from source, bypassing package.json scripts, so the generated file
      # needs to exist on disk before it runs (Test/Build below regenerate it themselves via their
      # own package scripts).
      - name: Generate SDK client types
        run: vp run --filter @dejanvasic85/matchday-sdk generate

      - name: Check (format + lint + type-check)
        run: vp check

      - name: Test
        run: vp run -r test

      - name: Build
        run: vp run -r build
