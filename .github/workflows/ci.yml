name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # packages/sdk's types are generated from the live OpenAPI spec, not committed — `vp check`
      # type-checks straight from source, bypassing package.json scripts, so the generated file
      # needs to exist on disk before it runs (Test/Build below regenerate it themselves via their
      # own package scripts).
      - name: Generate SDK client types
        run: vp run --filter @dejanvasic85/matchday-sdk generate

      - name: Check (format + lint + type-check)
        run: vp check

      - name: Test
        run: vp run -r test

      - name: Build
        run: vp run -r build
