name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check for a changeset on SDK changes
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: vp run changeset status --since=origin/main

      - name: Generate SDK client types
        run: vp run --filter @dejanvasic85/matchday-sdk generate

      - name: Check (format + lint + type-check)
        run: vp check

      - name: Test
        run: vp run -r test

      - name: Build
        run: vp run -r build

  fallow:
    name: Fallow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Fallow audit (code health)
        run: vp run fallow audit
