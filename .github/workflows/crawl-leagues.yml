name: Crawl leagues

on:
  # Dispatch-only, on purpose. GitHub's `schedule` trigger is best-effort: it delayed runs here by
  # 5 minutes to 4 hours and fired only 4 of 26 expected slots over one weekend. The
  # matchday-scheduler Worker (apps/scheduler) drives this hourly instead, and holds the game
  # windows in Melbourne local time so daylight saving doesn't shift them.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  R2_PUBLIC_ASSETS_URL: ${{ secrets.R2_PUBLIC_ASSETS_URL }}
  R2_RAW_BUCKET_NAME: ${{ secrets.R2_RAW_BUCKET_NAME }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    outputs:
      leagues: ${{ steps.leagues.outputs.leagues }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: List subscribed leagues
        id: leagues
        run: |
          output=$(vp run --filter @matchday/cli mday subscribed-leagues)
          leagues=$(echo "$output" | grep -o '{.*}' | jq -c '.leagueIds')
          echo "leagues=$leagues" >> "$GITHUB_OUTPUT"
          echo "Subscribed leagues: $leagues"

  crawl-leagues:
    name: Crawl subscribed leagues
    needs: setup
    if: needs.setup.outputs.leagues != '[]'
    runs-on: ubuntu-latest
    environment: production
    # Install Chrome's retry can itself take up to ~10 min worst case (see crawl-catalog.yml's
    # setup job) on top of this job's own crawl work.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        league: ${{ fromJson(needs.setup.outputs.leagues) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chrome-${{ hashFiles('pnpm-lock.yaml') }}

      # See crawl-catalog.yml's setup job steps for why this pins the apt mirror and retries with
      # a bounded timeout.
      - name: Pin apt to a reliable Ubuntu mirror
        run: echo "http://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt

      - name: Install Chrome
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2; do
            if timeout 300 vp run --filter @matchday/cli playwright:install; then
              exit 0
            fi
            echo "::warning::Chrome install attempt $attempt timed out or failed, retrying..."
            # A killed apt-get can leave its lock held — clear it before retrying.
            sudo pkill -9 -f apt-get || true
            sudo pkill -9 -f dpkg || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock \
              /var/lib/dpkg/lock-frontend
            sudo dpkg --configure -a || true
          done
          echo "::error::Chrome install failed after 2 attempts"
          exit 1

      - name: Run league crawl
        run: vp run --filter @matchday/cli mday crawl-leagues --league ${{ matrix.league }}
