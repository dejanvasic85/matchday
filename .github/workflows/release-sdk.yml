name: Publish SDK

on:
  push:
    branches:
      - main
    paths:
      - "packages/sdk/**"
      - ".changeset/**"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # RELEASE_PAT, not the default token: a PR opened by GITHUB_TOKEN triggers no workflow runs,
      # so its required Verify check never reports and the release PR can't be merged (#167).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      # Vite+'s setup-vp action doesn't put a bare pnpm binary on PATH, but changesets/action's
      # version/publish inputs below need one (same reason deploy.yml needs this for wrangler-action).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Written to the runner's user-level ~/.npmrc, not the repo's — pnpm 11 silently ignores
      # env-var tokens from a committed project .npmrc, which is what broke the first run of this.
      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@dejanvasic85:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc

      # Pending changesets open/update a bot "Version Packages" PR instead of publishing directly;
      # merging it consumes the changesets, triggering the actual publish.
      - name: Create release PR or publish
        uses: changesets/action@v2.1.1
        with:
          # Chains a `vp check --fix` after versioning — raw `changeset version` leaves
          # CHANGELOG.md in a style that fails `vp check` on the "Version Packages" PR.
          version-script: pnpm run version:sdk
          # A single script name, not "a && b" — changesets/action execs without a shell, so a
          # top-level `&&` here silently mis-chains (broke `vp pack`'s entry resolution once).
          publish-script: pnpm run release:sdk
          github-token: ${{ secrets.RELEASE_PAT }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
