name: Release SDK

on:
  push:
    branches:
      - main
    paths:
      - "packages/sdk/**"
      - ".changeset/**"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish @dejanvasic85/matchday-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # changesets/action's `version`/`publish` inputs below run as raw shell commands using
      # `pnpm` directly — Vite+'s setup-vp action manages pnpm internally without putting a bare
      # binary on PATH (same reason deploy.yml needs this for wrangler-action).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # `changeset publish` shells out to `npm publish` per package, which reads the registry from
      # packages/sdk/package.json's own `publishConfig` — this just supplies the auth token for
      # that registry (GitHub Packages requires it even for a public repo). Written to the
      # runner's user-level ~/.npmrc, not the repo's — pnpm 11 refuses to expand env-var tokens
      # from a *project* .npmrc (it's a committed file, so a malicious edit to it could redirect
      # the token to an attacker registry) and silently ignores the credential instead of erring,
      # which is exactly what broke the first run of this workflow.
      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@dejanvasic85:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc

      # Pending changesets in .changeset/ (every PR touching packages/sdk carries one — enforced
      # in ci.yml) → opens/updates a bot "Version Packages" PR instead of publishing directly.
      # Merging that PR consumes the changesets, which is what triggers the actual publish.
      #
      # v2.0.0 requires Changesets CLI v3 (bumped alongside this) and renamed the `version`/
      # `publish` inputs to `version-script`/`publish-script`. It also dropped the GITHUB_TOKEN
      # env var as an implicit credential source for the action's own git/PR operations — the
      # token must now be passed explicitly via the `github-token` input.
      - name: Create release PR or publish
        uses: changesets/action@v2.1.1
        with:
          version-script: pnpm changeset version
          # A single script name, not a raw "a && b" string — changesets/action execs this
          # without a shell, so a top-level `&&` here doesn't chain two commands: pnpm just
          # forwards everything after `run build` as extra CLI args onto the *last* command in
          # the string, which broke `vp pack`'s entry resolution the first time this ran.
          # `changeset publish` (not a raw `pnpm publish`) inside the script — it skips packages
          # whose version is already on the registry instead of hard-failing, so a docs-only
          # commit to packages/sdk that didn't bump the version stays a no-op here.
          publish-script: pnpm run release:sdk
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
